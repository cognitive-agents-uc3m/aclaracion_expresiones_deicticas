name: cognitive-agent

x-app: &app
  build:
    context: .
  image: cognitive-agent:tfm
  init: true
  restart: unless-stopped
  environment:
    COGNITIVE_AGENT__LLM__GCP_PROJECT: ${GCP_PROJECT_ID:?Configura GCP_PROJECT_ID en .env}
    COGNITIVE_AGENT__PERSISTENCE__DATA_DIR: /var/lib/cognitive-agent/data
    COGNITIVE_AGENT__PERSISTENCE__SLIDE_KNOWLEDGE_DB: /var/lib/cognitive-agent/slide_knowledge.sqlite3
    COGNITIVE_AGENT__STT__WHISPER_DEVICE: cpu
    COGNITIVE_AGENT__LLM__OLLAMA_BASE_URL: http://host.docker.internal:11434
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
  volumes:
    - cognitive-data:/var/lib/cognitive-agent
    - type: bind
      source: ${GCP_CREDENTIALS_FILE:?Configura GCP_CREDENTIALS_FILE en .env}
      target: /run/secrets/google-credentials.json
      read_only: true

services:
  profesor:
    <<: *app
    command: ["python", "gui.py"]
    ports:
      - "7860:7860"

  alumno:
    <<: *app
    command:
      - sh
      - -c
      - until python student_local.py --list; do sleep 2; done; exec python student_local.py --share-lan --follow-latest
    depends_on:
      profesor:
        condition: service_healthy
    ports:
      - "7861:7861"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7861/', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  cognitive-data: